; Astro RF Tool
; ESP32-S3-N16R8
; ST7735 128x160

[env:astro-rf-tool]

; Reuse the Smoochiee board JSON because it already describes
; the correct ESP32-S3 N16R8 hardware.
board = smoochiee-board

build_src_filter =
    ${env.build_src_filter}
    +<../boards/astro-rf-tool>

board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv

build_flags =
    ${env.build_flags}

    -Iboards/astro-rf-tool

    -Os
    -DCORE_DEBUG_LEVEL=1

    -DDEVICE_NAME='"Astro RF Tool"'

    ; Passive buzzer
    -DBUZZ_PIN=38

    ; Use second SPI controller for external RF modules
    -DUSE_HSPI_PORT=1

    ; IR options shown in Bruce menus
    -DIR_TX_PINS='{{"Astro IR TX", 8}}'
    -DIR_RX_PINS='{{"Astro IR RX", 21}}'

    ; Optional simple 433 MHz GPIO modules
    -DRF_TX_PINS='{{"GPIO 8", 8}}'
    -DRF_RX_PINS='{{"GPIO 21", 21}}'

lib_deps =
    ${env.lib_deps}
