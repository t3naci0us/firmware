[env:astro-rf-tool]

board = astro-rf-tool
board_build.variants_dir = boards
board_build.variant = pinouts
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_src_filter =
    ${env.build_src_filter}
    +<../boards/astro-rf-tool>

build_flags =
    ${env.build_flags}

    -Iboards/astro-rf-tool

    -DASTRO_RF_TOOL
    -DDEVICE_NAME='"Astro RF Tool"'

    -DUSE_HSPI_PORT=1

    -DCORE_DEBUG_LEVEL=3

lib_deps =
    ${env.lib_deps}
